# Build gates that run on every push and PR.
#
# Unit, build, Node IPC and stdio/HTTP SQL integration gates run before
# publishing a container. SQL integration uses the signed VGI protocol 2.2
# extension and exercises the live Open-Meteo API.
name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Typecheck + npm bundle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # Wrangler requires Node 22. The published bundle is checked separately
      # under Node 20 below, matching the package's supported runtime floor.
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Unit tests
        run: bun run test

      - name: Validate Cloudflare bundle
        run: bunx wrangler deploy --dry-run

      - name: Build the npm bundle
        run: bun run build:npm

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Verify the Node bundle over VGI IPC
        run: bun run scripts/smoke-npm.ts


  docker:
    needs: [build, integration]
    name: Docker image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      # arm64 is emulated on the amd64 runner. Slower to build, but the
      # alternative is an image that will not run on Apple Silicon or on any
      # arm64 host — and the README tells people to `docker run` this.
      - uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - uses: docker/setup-buildx-action@v3

      # Only a push to main or a tag publishes; PRs from forks have no
      # credentials, and building without pushing still proves the Dockerfile.
      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: GIT_COMMIT=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # The image serves HTTP, so "does it build" is not the question worth
      # answering — "does it answer /health" is. Runs on the locally built
      # image, before anything downstream depends on the pushed tag.
      - name: Smoke-test the image
        run: |
          docker build -t vgi-open-meteo:smoke --build-arg GIT_COMMIT=${{ github.sha }} .
          docker run -d --name smoke -p 8000:8000 vgi-open-meteo:smoke
          for _ in $(seq 1 60); do
            curl -fsS http://127.0.0.1:8000/health && break
            sleep 1
          done
          curl -fsS http://127.0.0.1:8000/health | tee /tmp/health.json
          grep -q '"status":"ok"' /tmp/health.json
          docker rm -f smoke

  # Expected to fail intermittently: Open-Meteo throttles GitHub-hosted runner
  # IPs, so live requests hang until the worker's fetch timeout aborts them.
  # Run the suites locally instead (see CLAUDE.md, "Testing").
  integration:
    name: SQL integration (${{ matrix.transport }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        transport: [stdio, http]
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - uses: astral-sh/setup-uv@v5
      - run: bun install --frozen-lockfile
      - name: Install matching SQL runner and signed extensions
        run: |
          uv tool install haybarn-unittest==1.5.6rc1
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          echo "FORCE INSTALL vgi FROM community; INSTALL httpfs; INSTALL json;" | uvx --from haybarn-cli==1.5.6rc1 haybarn
      - name: Run SQL integration suite
        run: make test-${{ matrix.transport }} TEST_RUNNER="$HOME/.local/bin/haybarn-unittest"
