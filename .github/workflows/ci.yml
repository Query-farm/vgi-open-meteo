# Build gates that run on every push and PR.
#
# Unit, build, Node IPC and stdio/launch/HTTP SQL integration gates run before
# publishing a container. SQL integration uses the published haybarn-unittest
# runner with the signed community vgi extension, offline; the scheduled
# `live` job exercises the live Open-Meteo API.
name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
  # Daily run of the live Open-Meteo suite (the `live` job); push/PR CI stays offline.
  schedule:
    - cron: '23 6 * * *'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Typecheck + npm bundle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # Wrangler requires Node 22. The published bundle is checked separately
      # under Node 20 below, matching the package's supported runtime floor.
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Unit tests
        run: bun run test

      - name: Validate Cloudflare bundle
        run: bunx wrangler deploy --dry-run

      - name: Build the npm bundle
        run: bun run build:npm

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Verify the Node bundle over VGI IPC
        run: bun run scripts/smoke-npm.ts


  docker:
    needs: [build, integration]
    name: Docker image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      # arm64 is emulated on the amd64 runner. Slower to build, but the
      # alternative is an image that will not run on Apple Silicon or on any
      # arm64 host — and the README tells people to `docker run` this.
      - uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - uses: docker/setup-buildx-action@v3

      # Only a push to main or a tag publishes; PRs from forks have no
      # credentials, and building without pushing still proves the Dockerfile.
      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: GIT_COMMIT=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # The image serves HTTP, so "does it build" is not the question worth
      # answering — "does it answer /health" is. Runs on the locally built
      # image, before anything downstream depends on the pushed tag.
      - name: Smoke-test the image
        run: |
          docker build -t vgi-open-meteo:smoke --build-arg GIT_COMMIT=${{ github.sha }} .
          docker run -d --name smoke -p 8000:8000 vgi-open-meteo:smoke
          for _ in $(seq 1 60); do
            curl -fsS http://127.0.0.1:8000/health && break
            sleep 1
          done
          curl -fsS http://127.0.0.1:8000/health | tee /tmp/health.json
          grep -q '"status":"ok"' /tmp/health.json
          docker rm -f smoke

  # Offline SQL suite over every transport (ci/run-integration.sh, the vgi-starter
  # standard, against ci/worker). Files that call the live Open-Meteo API carry
  # `require-env OPEN_METEO_LIVE` and skip here, so push/PR CI is deterministic.
  integration:
    name: SQL integration (${{ matrix.transport }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        transport: [stdio, launch, http]
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - uses: astral-sh/setup-uv@v6
      - run: bun install --frozen-lockfile
      - name: Run SQL integration suite (offline)
        run: make test-sql TRANSPORT=${{ matrix.transport }}

  # The live suite, daily or on manual dispatch only. Open-Meteo throttles
  # GitHub-hosted runner IPs by letting connections hang (no 429), so live
  # requests can time out through no fault of the worker. ci/run-live-sql.sh
  # fails the job on any real failure and downgrades a run whose every failure
  # is that upstream timeout to a warning annotation.
  live:
    name: SQL integration live (Open-Meteo API)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - uses: astral-sh/setup-uv@v6
      - run: bun install --frozen-lockfile
      - name: Probe Open-Meteo reachability from this runner
        run: |
          for host in api geocoding-api archive-api climate-api air-quality-api marine-api flood-api; do
            curl -s -o /dev/null -m 10 -w "$host.open-meteo.com %{http_code} %{time_total}s\n" \
              "https://$host.open-meteo.com/" || echo "$host.open-meteo.com unreachable (curl exit $?)"
          done
      - name: Run the live SQL suite
        run: ci/run-live-sql.sh test-sql-live TRANSPORT=stdio
