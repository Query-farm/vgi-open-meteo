# Publish the worker to npm when a GitHub release is published.
#
# Mirrors the release flow of the other Query Farm packages: cut a GitHub
# release, CI builds from that tag and publishes. `id-token: write` is what npm
# needs to attach provenance, so the tarball on npm is traceable to this
# workflow run and this commit.
name: Publish to npm

on:
  release:
    types: [published]

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"

      # npm >= 11.5.1 for trusted publishing / provenance.
      - name: Update npm
        run: npm install -g npm@latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Verify the tag matches package.json
        # A tag that disagrees with the manifest publishes a version nobody can
        # find from the release page. Cheaper to fail here than to unpublish.
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(node -p "require('./package.json').version")"
          if [ "$tag" != "$pkg" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match package.json version $pkg"
            exit 1
          fi
          echo "publishing $pkg"

      - name: Build the bundle
        run: bun run build:npm

      - name: Verify the bundle runs under node
        # The published bin is the bundle, and npx runs it with node. If it
        # cannot start here it cannot start for anyone, and npm publishes are
        # not reversible after 72 hours.
        run: |
          node dist/worker.mjs > /tmp/worker.log 2>&1 &
          pid=$!
          for _ in $(seq 1 40); do
            grep -q "calling run()" /tmp/worker.log && break
            sleep 0.25
          done
          kill "$pid" 2>/dev/null || true
          grep -q "calling run()" /tmp/worker.log || { cat /tmp/worker.log; exit 1; }

      - name: Publish
        run: npm publish --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
